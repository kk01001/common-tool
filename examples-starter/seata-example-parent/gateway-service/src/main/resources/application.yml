server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      enabled: true

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      redis-route-definition-repository:
        enabled: true
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      discovery:
        locator:
          enabled: true # 开启从注册中心动态创建路由的功能，利用微服务名进行路由
          lower-case-service-id: true
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
            methods: GET,POST,PUT,DELETE
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      routes:
        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/business/**
          filters:
          - name: Retry
            args:
              retries: 3
              statuses: BAD_GATEWAY
              methods: GET,POST
              backoff:
                firstBackoff: 10ms
                maxBackoff: 50ms
                factor: 2
                basedOnPreviousValue: false
              jitter:
                randomFactor: 0.5
              timeout: 100ms
          - name: RequestRateLimiter
            args:
              bucket4j-rate-limiter.capacity: 10       # 总容量
              bucket4j-rate-limiter.refillTokens: 1    # 每次补充的令牌数
              bucket4j-rate-limiter.refillPeriod: 1s   # 补充周期
              bucket4j-rate-limiter.requestedTokens: 1 # 每次请求消耗的令牌数
              key-resolver: "#{@userKeyResolver}"      # 限流 Key 解析器 Bean 名称
          metadata:
            response-timeout: 200
            connect-timeout: 200

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**

        - id: storage-service
          uri: lb://storage-service
          predicates:
            - Path=/storage-api/**
          filters:
            - RewritePath=/storage-api/?(?<segment>.*), /storage/$\{segment}
            
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/account/**