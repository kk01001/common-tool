server:
  port: 8082

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 10.255.1.8:8848
        group: seata
        namespace: cloud
        username: cloud
        password: cloud@2020
      config:
        server-addr: 10.255.1.8:8848
        group: seata
        namespace: cloud
        username: cloud
        password: cloud@2020
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.255.1.8:3306/seata_order?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: cqt@1234

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: my_test_tx_group
  service:
    vgroup-mapping:
      my_test_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 10.255.1.8:8848
      namespace: cloud
      group: seata
      username: cloud
      password: cloud@2020
  config:
    type: nacos
    nacos:
      server-addr: 10.255.1.8:8848
      namespace: cloud
      group: seata
      username: cloud
      password: cloud@2020

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true