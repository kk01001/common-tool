<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MQTT Web Demo</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background-color: #fff;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: #333;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            padding: 18px;
        }
        legend {
            padding: 0 8px;
            font-weight: bold;
            color: #0a6ed1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 14px;
        }
        button {
            background-color: #0a6ed1;
            border: none;
            color: #fff;
            padding: 10px 18px;
            margin-right: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            background-color: #b3d4fc;
            cursor: not-allowed;
        }
        #log {
            height: 280px;
            /*width: 500px;*/
            background-color: #111;
            color: #0f0;
            font-family: "Consolas", monospace;
            overflow-y: auto;
            border-radius: 8px;
            padding: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .status {
            margin-bottom: 12px;
            font-weight: bold;
        }
        .status.connected {
            color: #1a7f37;
        }
        .status.disconnected {
            color: #d93025;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>MQTT WebSocket Demo</h1>
    <p>通过 WebSocket 连接 MQTT Broker，实时发送与接收消息。</p>

    <fieldset>
        <legend>连接配置</legend>
        <label for="brokerUrl">Broker WebSocket 地址 (例如 ws://localhost:8083/mqtt)</label>
        <input id="brokerUrl" type="text" value="ws://10.255.1.21:8083/mqtt"/>

        <label for="username">用户名 (可选)</label>
        <input id="username" type="text" placeholder="如果 broker 需要鉴权，请填写" />

        <label for="password">密码 (可选)</label>
        <input id="password" type="text" placeholder="如果 broker 需要鉴权，请填写" />

        <label for="mqttVersion">MQTT 协议版本</label>
        <select id="mqttVersion">
            <option value="4" selected>3.1.1</option>
            <option value="5">5.0</option>
        </select>

        <button id="connectBtn">连接</button>
        <button id="disconnectBtn" disabled>断开</button>
        <div id="status" class="status disconnected">状态：未连接</div>
    </fieldset>

    <fieldset>
        <legend>订阅配置</legend>
        <label for="subTopic">订阅主题</label>
        <input id="subTopic" type="text" value="demo/topic" />

        <button id="subscribeBtn" disabled>订阅</button>
        <button id="unsubscribeBtn" disabled>取消订阅</button>
    </fieldset>

    <fieldset>
        <legend>消息发送</legend>
        <label for="pubTopic">发布主题</label>
        <input id="pubTopic" type="text" value="demo/topic" />

        <label for="messageInput">消息内容</label>
        <textarea id="messageInput" rows="4">{"type":"ping","timestamp":0}</textarea>

        <button id="sendBtn" disabled>发送消息</button>
        <button id="sendReplyBtn" disabled>回复收到的最新消息</button>
    </fieldset>

    <fieldset>
        <legend>后端批量发送</legend>
        <label for="bulkCount">批量条数</label>
        <input id="bulkCount" type="text" value="500" />
        <button id="bulkSendBtn">调用后端批量发送</button>
        <p style="color:#666;font-size:12px;">说明：调用服务端接口使用 MqttTemplate 同步发送，默认 QoS=2。</p>
    </fieldset>

    <fieldset>
        <legend>消息日志</legend>
        <div id="log"></div>
    </fieldset>
</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const unsubscribeBtn = document.getElementById('unsubscribeBtn');
    const sendBtn = document.getElementById('sendBtn');
    const sendReplyBtn = document.getElementById('sendReplyBtn');
    const bulkSendBtn = document.getElementById('bulkSendBtn');
    const statusLabel = document.getElementById('status');
    const logContainer = document.getElementById('log');
    const mqttVersionSelect = document.getElementById('mqttVersion');
    let fallbackStop = false;

    let client = null;
    let lastReceivedTopic = null;
    let lastReceivedPayload = null;

    const log = (message) => {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.textContent = `[${time}] ${message}`;
        logContainer.appendChild(line);
        logContainer.scrollTop = logContainer.scrollHeight;
    };

    const updateStatus = (connected) => {
        if (connected) {
            statusLabel.textContent = '状态：已连接';
            statusLabel.classList.remove('disconnected');
            statusLabel.classList.add('connected');
        } else {
            statusLabel.textContent = '状态：未连接';
            statusLabel.classList.remove('connected');
            statusLabel.classList.add('disconnected');
        }
    };

    function buildCandidates(brokerUrl) {
        let u;
        try {
            u = new URL(brokerUrl);
        } catch (e) {
            alert('地址格式不正确，请检查');
            log(`地址格式错误：${e.message}`);
            return [];
        }
        const paths = new Set();
        const path = u.pathname || '/';
        paths.add(path);
        paths.add('/');
        paths.add('/mqtt');
        const uniquePaths = Array.from(paths);
        return uniquePaths.map(p => `${u.protocol}//${u.host}${p}`);
    }

    function attemptConnectWithFallbacks(candidateUrls, initialVersion, username, password) {
        const versions = [initialVersion, initialVersion === 5 ? 4 : 5];
        let idx = 0;
        fallbackStop = false;

        const tryNext = () => {
            if (fallbackStop) {
                log('已停止连接尝试');
                return;
            }
            if (idx >= candidateUrls.length * versions.length) {
                log('所有候选组合均尝试失败，请检查 Broker 配置或网络可达性');
                updateStatus(false);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                subscribeBtn.disabled = true;
                unsubscribeBtn.disabled = true;
                sendBtn.disabled = true;
                sendReplyBtn.disabled = true;
                return;
            }
            const candidateIndex = Math.floor(idx / versions.length);
            const versionIndex = idx % versions.length;
            const url = candidateUrls[candidateIndex];
            const version = versions[versionIndex];
            idx++;

            if (client) {
                try { client.end(true); } catch (e) {}
            }

            const clientId = `web-client-${Math.random().toString(16).slice(2, 10)}`;
            const options = {
                clientId,
                clean: true,
                reconnectPeriod: 2000,
                keepalive: 60,
                connectTimeout: 30_000,
                protocolId: 'MQTT',
                protocolVersion: version,
                reschedulePings: true,
                resubscribe: true,
                queueQoSZero: true,
                manualConnect: false,
                properties: {
                    sessionExpiryInterval: 0,
                    receiveMaximum: 65_535,
                    maximumPacketSize: undefined,
                    topicAliasMaximum: 0,
                    requestResponseInformation: false,
                    requestProblemInformation: true,
                    userProperties: {}
                },
                will: undefined,
                transformWsUrl: undefined,
                wsOptions: {},
                servers: undefined,
                username: username || undefined,
                password: password || undefined,
                rejectUnauthorized: true
            };

            log(`尝试连接 ${url}，协议版本=${version}，clientId=${clientId}`);
            client = mqtt.connect(url, options);

            const timeoutId = setTimeout(() => {
                if (!client || !client.connected) {
                    log('连接超时，继续尝试下一组合');
                    try { client.end(true); } catch (e) {}
                    setTimeout(tryNext, 300);
                }
            }, 5000);

            client.on('connect', () => {
                clearTimeout(timeoutId);
                log(`连接成功：url=${url}，协议版本=${version}`);
                updateStatus(true);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                subscribeBtn.disabled = false;
                sendBtn.disabled = false;
            });

            client.on('reconnect', () => {
                log('正在重连...');
            });

            client.on('error', (err) => {
                clearTimeout(timeoutId);
                const msg = err && err.message ? err.message : String(err);
                const code = err && err.code ? ` (code=${err.code})` : '';
                log(`连接错误：${msg}${code}，尝试其他组合...`);
                try { client.end(true); } catch (e) {}
                setTimeout(tryNext, 300);
            });

            client.on('close', () => {
                // 仅在没有连接成功的情况下展示关闭提示，避免重连时过多日志
                if (!client.connected) {
                    log('连接已关闭');
                }
                updateStatus(false);
                // 不在此处切换组合，交由 error/timeout 处理
            });

            client.on('message', (topic, payload) => {
                const text = payload.toString();
                log(`收到消息 - topic: ${topic}, payload: ${text}`);
                lastReceivedTopic = topic;
                lastReceivedPayload = text;
                sendReplyBtn.disabled = false;
            });
        };

        tryNext();
    }

    connectBtn.addEventListener('click', () => {
        const brokerUrl = document.getElementById('brokerUrl').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!brokerUrl) {
            alert('请填写 broker WebSocket 地址');
            return;
        }
        const initialVersion = Number(mqttVersionSelect.value);
        const candidates = buildCandidates(brokerUrl);
        if (!candidates.length) {
            return;
        }
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        log(`开始连接尝试（含路径与协议版本回退），候选URL=${candidates.join(', ')}`);
        attemptConnectWithFallbacks(candidates, initialVersion, username, password);
    });

    disconnectBtn.addEventListener('click', () => {
        if (client) {
            client.end(true, () => {
                log('主动断开连接');
            });
        }
        // 停止连接回退流程
        fallbackStop = true;
        updateStatus(false);
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        subscribeBtn.disabled = true;
        unsubscribeBtn.disabled = true;
        sendBtn.disabled = true;
        sendReplyBtn.disabled = true;
    });

    subscribeBtn.addEventListener('click', () => {
        if (!client || !client.connected) {
            alert('请先连接 MQTT Broker');
            return;
        }
        const topic = document.getElementById('subTopic').value.trim();
        if (!topic) {
            alert('请填写订阅主题');
            return;
        }
        client.subscribe(topic, { qos: 1 }, (err, granted) => {
            if (err) {
                log(`订阅失败：${err.message}`);
            } else {
                log(`订阅成功：${granted.map(g => g.topic).join(', ')}`);
                unsubscribeBtn.disabled = false;
            }
        });
    });

    unsubscribeBtn.addEventListener('click', () => {
        if (!client || !client.connected) {
            return;
        }
        const topic = document.getElementById('subTopic').value.trim();
        if (!topic) {
            return;
        }
        client.unsubscribe(topic, (err) => {
            if (err) {
                log(`取消订阅失败：${err.message}`);
            } else {
                log(`已取消订阅：${topic}`);
                unsubscribeBtn.disabled = true;
            }
        });
    });

    sendBtn.addEventListener('click', () => {
        if (!client || !client.connected) {
            alert('请先连接 MQTT Broker');
            return;
        }
        const topic = document.getElementById('pubTopic').value.trim();
        const message = document.getElementById('messageInput').value;
        if (!topic) {
            alert('请填写发布主题');
            return;
        }
        client.publish(topic, message, { qos: 0, retain: false }, (err) => {
            if (err) {
                log(`发送失败：${err.message}`);
            } else {
                log(`已发送消息 - topic: ${topic}, payload: ${message}`);
            }
        });
    });

    sendReplyBtn.addEventListener('click', () => {
        if (!client || !client.connected) {
            alert('请先连接 MQTT Broker');
            return;
        }
        if (!lastReceivedTopic) {
            alert('尚未收到任何消息，无法回复');
            return;
        }
        const replyTopic = document.getElementById('pubTopic').value.trim() || lastReceivedTopic;
        const payload = JSON.stringify({
            type: 'reply',
            originTopic: lastReceivedTopic,
            originPayload: lastReceivedPayload,
            replyAt: Date.now()
        });
        client.publish(replyTopic, payload, { qos: 0 }, (err) => {
            if (err) {
                log(`回复发送失败：${err.message}`);
            } else {
                log(`已回复消息 - topic: ${replyTopic}, payload: ${payload}`);
            }
        });
    });

    // 后端批量发送
    bulkSendBtn.addEventListener('click', async () => {
        const topic = document.getElementById('pubTopic').value.trim();
        const bulkCountStr = document.getElementById('bulkCount').value.trim();
        const bulkCount = parseInt(bulkCountStr, 10);
        if (!topic) {
            alert('请填写发布主题');
            return;
        }
        if (isNaN(bulkCount) || bulkCount < 1) {
            alert('批量条数必须为正整数');
            return;
        }
        try {
            log(`准备调用后端批量发送接口，topic=${topic}, count=${bulkCount}`);
            const resp = await fetch('/api/mqtt/bulk-send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, count: bulkCount, qos: 2, payloadPrefix: 'Batch message' })
            });
            const data = await resp.json();
            if (data && data.code === 0) {
                const r = data.data;
                log(`后端批量发送完成：success=${r.successCount}, failure=${r.failureCount}, durationMs=${r.durationMs}`);
            } else {
                log(`后端批量发送失败：${data && data.message ? data.message : '未知错误'}`);
                alert(data && data.message ? data.message : '批量发送失败');
            }
        } catch (e) {
            log(`调用接口异常：${e.message}`);
            alert(`调用接口异常：${e.message}`);
        }
    });
</script>
</body>
</html>
