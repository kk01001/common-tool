server:
  port: 8034

spring:
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/

# MQTT Spring Boot Starter 完整配置示例
# 本文件展示了所有可用的配置项及其说明

mqtt:
  # ============================================
  # 基础配置（必填）
  # ============================================
  
  # 是否启用 MQTT（必须设置为 true 才能启用 MQTT 功能）
  enabled: true
  
  # MQTT Broker 地址
  # 格式：tcp://host:port 或 ssl://host:port
  # 示例：
  #   - tcp://localhost:1883        # 本地 MQTT Broker
  #   - tcp://10.255.1.21:1883      # 远程 MQTT Broker
  #   - ssl://broker.emqx.io:8883   # 使用 SSL/TLS 加密连接
  broker-url: tcp://10.255.1.21:1883
  
  # ============================================
  # 客户端配置（可选）
  # ============================================
  
  # 客户端 ID（可选，不设置则自动生成）
  # 注意：同一个 Broker 上的客户端 ID 必须唯一
  # 如果不设置，系统会自动生成格式为 "mqtt-client-{UUID}" 的 ID
  client-id: mqtt-client-demo
  
  # 用户名（如果 Broker 需要认证）
  username: "admin"
  
  # 密码（如果 Broker 需要认证）
  password: "admin"
  
  # ============================================
  # 连接行为配置
  # ============================================
  
  # 是否清除会话
  # true：每次连接都是新会话，不保留之前的订阅和未确认消息
  # false：保留会话状态，断线重连后可以接收离线期间的消息（需要 Broker 支持）
  clean-session: true
  
  # 连接超时时间
  # 格式：数字 + 时间单位（s=秒, m=分钟, h=小时）
  connection-timeout: 30s
  
  # 保持连接时间间隔（心跳间隔）
  # 客户端会定期发送 PING 消息保持连接
  # 如果在此时间内没有消息交互，客户端会发送心跳
  keep-alive-interval: 60s
  
  # 是否自动重连
  # true：连接断开后自动尝试重连
  # false：连接断开后不重连，需要手动重连
  automatic-reconnect: true
  
  # 最大重连延迟时间
  # 重连使用指数退避策略，此值为最大延迟时间
  max-reconnect-delay: 128s
  
  # ============================================
  # 遗嘱消息配置（Last Will and Testament）
  # ============================================
  # 遗嘱消息：当客户端异常断开连接时，Broker 会自动发送的消息
  # 常用于通知其他客户端某个客户端已离线
  
  will:
    # 遗嘱消息的主题
    topic: testtopic/will
    
    # 遗嘱消息的内容
    payload: Client disconnected unexpectedly
    
    # 遗嘱消息的 QoS 级别
    # 0：最多一次
    # 1：至少一次
    # 2：只有一次
    qos: 1
    
    # 是否保留遗嘱消息
    # true：Broker 会保留此消息，新订阅者会立即收到
    # false：只发送给当前订阅者
    retained: false
  
  # ============================================
  # 生产者配置（消息发送）
  # ============================================
  
  producer:
    # 默认 QoS 级别（当发送消息时未指定 QoS 时使用）
    # 0：最多一次（性能最高，可能丢失）
    # 1：至少一次（推荐，平衡性能和可靠性）
    # 2：只有一次（可靠性最高，性能较低）
    default-qos: 1
    
    # 默认是否保留消息
    # true：Broker 会保留此消息，新订阅者会立即收到最后一条保留消息
    # false：只发送给当前订阅者
    default-retained: false
    
    # 发送超时时间
    # 消息发送的最大等待时间
    send-timeout: 5s
    
    # 是否异步发送
    # true：发送消息后立即返回，不等待确认
    # false：等待消息发送完成后返回
    async: false
  
  # ============================================
  # 消费者配置（消息接收）
  # ============================================
  
  consumer:
    # 默认订阅的主题（可选）
    # 这些主题会在应用启动时自动订阅
    # 注意：使用 @MqttMessageListener 注解的主题会自动订阅，无需在此配置
    topics:
      - testtopic/#
      - system/+/status
    
    # 默认 QoS 级别（当订阅时未指定 QoS 时使用）
    default-qos: 1
    
    # 消费线程池大小
    # 用于处理接收到的消息的线程数
    # 根据消息处理的复杂度和频率调整
    # 建议值：
    #   - 简单处理：5-10
    #   - 中等复杂度：10-20
    #   - 复杂处理或高并发：20-50
    thread-pool-size: 10
    
    # 消费线程池队列大小
    # 当所有线程都在处理消息时，新消息会放入队列等待
    # 如果队列满了，会触发拒绝策略（默认使用 CallerRunsPolicy）
    # 建议值：
    #   - 低流量：500-1000
    #   - 中等流量：1000-2000
    #   - 高流量：2000-5000
    queue-capacity: 1000

# EMQX HTTP 鉴权示例配置（用于 /api/emqx/auth）
emqx:
  auth:
    users:
      - username: u001
        password: u001pass
        superuser: false
      - username: u002
        password: u002pass
        superuser: true

