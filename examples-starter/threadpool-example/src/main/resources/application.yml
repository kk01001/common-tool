spring:
  application:
    name: threadpool-example
  
  # 数据源配置 (H2 内存数据库)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      pool-name: HikariPool-Main
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # H2 控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8037

# Dynamic ThreadPool Configuration
dynamic-threadpool:
  enabled: true
  
  global:
    corePoolSize: 5
    maxPoolSize: 10
    queueCapacity: 100
    keepAliveTime: 60s
    threadNamePrefix: demo-
    allowCoreThreadTimeout: false
    enableTtl: true  # 启用 TTL
  
  pools:
    order-pool:
      corePoolSize: 10
      maxPoolSize: 20
      queueCapacity: 200
      threadNamePrefix: order-
      enableTtl: true
      auto-init: true
      queue-type: RESIZABLE_LINKED_BLOCKING_QUEUE
    
    async-pool:
      corePoolSize: 5
      maxPoolSize: 15
      queueCapacity: 50
      threadNamePrefix: async-
      auto-init: true
      enableTtl: true
      allow-core-thread-timeout: true
      queue-type: RESIZABLE_LINKED_BLOCKING_QUEUE
  
  monitor:
    enabled: true
    enableActuator: true
    enableMetrics: true
    collectInterval: 5s
  
  alarm:
    enabled: true
    queueUsageThreshold: 0.8
    activeThreadRatioThreshold: 0.9
    rejectCountThreshold: 10
    alarmInterval: 1m
    channelType: WECHAT  # 可选: LOG, WECHAT, DINGTALK, ALL
    wechatWebhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=6c04cbb9-42fb-47d4-8e11-f9003a3608cd
    # dingTalkWebhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN
    # mentionedAll: false
    # mentionedMobileList:
    #   - "13800138000"
  
  # 第三方线程池管理（Tomcat 线程池）
  third-party:
    enabled: true
    pools:
      - type: TOMCAT
        name: main
        enabled: true
        max-threads: 200
        min-threads: 10
        max-connections: 10000
      
      - type: HIKARI
        name: main
        enabled: true
        max-threads: 10
        min-threads: 5

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    io.github.kk01001: DEBUG
    root: INFO
