<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级功能演示 - MyBatis Plus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #333;
            font-size: 2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.9em;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .demo-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .demo-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .demo-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .demo-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .input-group label {
            color: #333;
            font-weight: 600;
            min-width: 80px;
        }

        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
        }

        .log-container {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #444;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-success {
            color: #50fa7b;
        }

        .log-error {
            color: #ff5555;
        }

        .log-info {
            color: #8be9fd;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9em;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9em;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-available {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .badge-out-of-stock {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .badge-discontinued {
            background: linear-gradient(135deg, #757f9a 0%, #d7dde8 100%);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>🚀 MyBatis Plus 高级功能演示</h1>
        <div>
            <button class="btn btn-success" onclick="loadProducts()">🔄 刷新数据</button>
            <button class="btn btn-danger" onclick="clearAllProducts()">🗑️ 清空数据</button>
            <a href="/" class="btn btn-secondary">🏠 返回首页</a>
        </div>
    </div>

    <div class="demo-grid">
        <!-- SQL 注入器 - 批量插入 -->
        <div class="demo-card">
            <h2>📦 SQL 注入器 - 批量插入</h2>
            <p>演示自定义 SQL 方法,实现高效的批量插入操作</p>
            <div class="input-group">
                <label>插入数量:</label>
                <input type="number" id="batchCount" value="100" min="1" max="1000">
            </div>
            <div class="demo-actions">
                <button class="btn btn-primary" onclick="batchInsert()">批量插入</button>
            </div>
            <div id="batchLog" class="log-container" style="display:none;"></div>
        </div>

        <!-- 流式查询 -->
        <div class="demo-card">
            <h2>🌊 流式查询</h2>
            <p>使用 ResultHandler 处理大数据量,避免内存溢出</p>
            <div class="demo-actions">
                <button class="btn btn-primary" onclick="streamQuery()">执行流式查询</button>
            </div>
            <div id="streamLog" class="log-container" style="display:none;"></div>
            <div id="streamStats" class="stats-grid" style="display:none;"></div>
        </div>

        <!-- 乐观锁 -->
        <div class="demo-card">
            <h2>🔒 乐观锁</h2>
            <p>演示并发更新时的版本号控制机制</p>
            <div class="input-group">
                <label>产品ID:</label>
                <input type="number" id="lockProductId" value="1" min="1">
            </div>
            <div class="input-group">
                <label>新库存:</label>
                <input type="number" id="lockStock" value="999" min="0">
            </div>
            <div class="demo-actions">
                <button class="btn btn-primary" onclick="testOptimisticLock()">更新库存</button>
                <button class="btn btn-secondary" onclick="testConcurrentUpdate()">模拟并发</button>
            </div>
            <div id="lockLog" class="log-container" style="display:none;"></div>
        </div>

        <!-- 逻辑删除 -->
        <div class="demo-card">
            <h2>🗑️ 逻辑删除</h2>
            <p>软删除机制,删除的数据仍保留在数据库中</p>
            <div class="input-group">
                <label>产品ID:</label>
                <input type="number" id="deleteProductId" value="1" min="1">
            </div>
            <div class="demo-actions">
                <button class="btn btn-danger" onclick="logicDelete()">逻辑删除</button>
            </div>
            <div id="deleteLog" class="log-container" style="display:none;"></div>
        </div>
    </div>

    <!-- 产品列表 -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>产品名称</th>
                <th>价格</th>
                <th>库存</th>
                <th>版本号</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="productTableBody">
            <tr>
                <td colspan="8" style="text-align:center;padding:40px;color:#999;">
                    加载中...
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 页面加载时获取产品列表
    window.onload = function () {
        loadProducts();
    };

    // 加载产品列表
    function loadProducts() {
        fetch('/api/advanced/products')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderProductTable(data.data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('加载产品列表失败');
            });
    }

    // 渲染产品表格
    function renderProductTable(products) {
        const tbody = document.getElementById('productTableBody');
        if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = products.map(product => `
                <tr>
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>¥${product.price}</td>
                    <td>${product.stock}</td>
                    <td>${product.version}</td>
                    <td>${getStatusBadge(product.status)}</td>
                    <td>${formatDateTime(product.createTime)}</td>
                    <td>
                        <button class="btn btn-danger btn-small" onclick="deleteProduct(${product.id})">删除</button>
                    </td>
                </tr>
            `).join('');
    }

    // 批量插入
    function batchInsert() {
        const count = document.getElementById('batchCount').value;
        const logDiv = document.getElementById('batchLog');
        logDiv.style.display = 'block';
        logDiv.innerHTML = '<div class="log-info">开始批量插入 ' + count + ' 条记录...</div>';

        fetch('/api/advanced/batch-insert?count=' + count, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    logDiv.innerHTML += '<div class="log-success">✓ ' + data.message + '</div>';
                    logDiv.innerHTML += '<div class="log-info">插入记录数: ' + data.insertedRows + '</div>';
                    logDiv.innerHTML += '<div class="log-info">执行时间: ' + data.executionTime + 'ms</div>';
                    loadProducts();
                } else {
                    logDiv.innerHTML += '<div class="log-error">✗ 批量插入失败</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                logDiv.innerHTML += '<div class="log-error">✗ 请求失败: ' + error.message + '</div>';
            });
    }

    // 流式查询
    function streamQuery() {
        const logDiv = document.getElementById('streamLog');
        const statsDiv = document.getElementById('streamStats');
        logDiv.style.display = 'block';
        statsDiv.style.display = 'none';
        logDiv.innerHTML = '<div class="log-info">开始流式查询...</div>';

        fetch('/api/advanced/stream-query')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    logDiv.innerHTML += '<div class="log-success">✓ 流式查询完成</div>';
                    logDiv.innerHTML += '<div class="log-info">处理记录数: ' + data.totalCount + '</div>';
                    logDiv.innerHTML += '<div class="log-info">总库存: ' + data.totalStock + '</div>';
                    logDiv.innerHTML += '<div class="log-info">执行时间: ' + data.executionTime + 'ms</div>';

                    // 显示统计信息
                    statsDiv.style.display = 'grid';
                    statsDiv.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-value">${data.totalCount}</div>
                            <div class="stat-label">处理记录数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.totalStock}</div>
                            <div class="stat-label">总库存</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.executionTime}ms</div>
                            <div class="stat-label">执行时间</div>
                        </div>
                    `;
                } else {
                    logDiv.innerHTML += '<div class="log-error">✗ 流式查询失败</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                logDiv.innerHTML += '<div class="log-error">✗ 请求失败: ' + error.message + '</div>';
            });
    }

    // 测试乐观锁
    function testOptimisticLock() {
        const id = document.getElementById('lockProductId').value;
        const stock = document.getElementById('lockStock').value;
        const logDiv = document.getElementById('lockLog');
        logDiv.style.display = 'block';
        logDiv.innerHTML = '<div class="log-info">更新产品 ' + id + ' 的库存为 ' + stock + '...</div>';

        fetch('/api/advanced/optimistic-lock?id=' + id + '&stock=' + stock, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    logDiv.innerHTML += '<div class="log-success">✓ ' + data.message + '</div>';
                    loadProducts();
                } else {
                    logDiv.innerHTML += '<div class="log-error">✗ ' + data.message + '</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                logDiv.innerHTML += '<div class="log-error">✗ 请求失败: ' + error.message + '</div>';
            });
    }

    // 模拟并发更新
    function testConcurrentUpdate() {
        const id = document.getElementById('lockProductId').value;
        const logDiv = document.getElementById('lockLog');
        logDiv.style.display = 'block';
        logDiv.innerHTML = '<div class="log-info">模拟两个并发更新...</div>';

        // 同时发起两个更新请求
        Promise.all([
            fetch('/api/advanced/optimistic-lock?id=' + id + '&stock=100', {method: 'POST'}).then(r => r.json()),
            fetch('/api/advanced/optimistic-lock?id=' + id + '&stock=200', {method: 'POST'}).then(r => r.json())
        ])
            .then(results => {
                results.forEach((data, index) => {
                    if (data.success) {
                        logDiv.innerHTML += '<div class="log-success">✓ 更新' + (index + 1) + ': ' + data.message + '</div>';
                    } else {
                        logDiv.innerHTML += '<div class="log-error">✗ 更新' + (index + 1) + ': ' + data.message + '</div>';
                    }
                });
                logDiv.innerHTML += '<div class="log-info">说明: 由于乐观锁机制,只有一个更新会成功</div>';
                loadProducts();
            })
            .catch(error => {
                console.error('Error:', error);
                logDiv.innerHTML += '<div class="log-error">✗ 请求失败: ' + error.message + '</div>';
            });
    }

    // 逻辑删除
    function logicDelete() {
        const id = document.getElementById('deleteProductId').value;
        const logDiv = document.getElementById('deleteLog');
        logDiv.style.display = 'block';
        logDiv.innerHTML = '<div class="log-info">逻辑删除产品 ' + id + '...</div>';

        fetch('/api/advanced/products/' + id, {
            method: 'DELETE'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    logDiv.innerHTML += '<div class="log-success">✓ ' + data.message + '</div>';
                    logDiv.innerHTML += '<div class="log-info">说明: 数据仍在数据库中,但查询时会自动过滤</div>';
                    loadProducts();
                } else {
                    logDiv.innerHTML += '<div class="log-error">✗ ' + data.message + '</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                logDiv.innerHTML += '<div class="log-error">✗ 请求失败: ' + error.message + '</div>';
            });
    }

    // 删除产品
    function deleteProduct(id) {
        // if (!confirm('确定要删除这个产品吗?')) return;

        fetch('/api/advanced/products/' + id, {
            method: 'DELETE'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    loadProducts();
                } else {
                    alert('删除失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('删除失败');
            });
    }

    // 清空所有产品
    function clearAllProducts() {
        if (!confirm('确定要清空所有产品数据吗?')) return;

        fetch('/api/advanced/products/clear', {
            method: 'DELETE'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    loadProducts();
                } else {
                    alert('清空失败');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('清空失败');
            });
    }

    // 获取状态徽章
    function getStatusBadge(status) {
        const statusMap = {
            'AVAILABLE': {class: 'badge-available', text: '在售'},
            'OUT_OF_STOCK': {class: 'badge-out-of-stock', text: '缺货'},
            'DISCONTINUED': {class: 'badge-discontinued', text: '停售'}
        };
        const s = statusMap[status] || {class: 'badge-available', text: status};
        return `<span class="badge ${s.class}">${s.text}</span>`;
    }

    // 格式化日期时间
    function formatDateTime(dateTime) {
        if (!dateTime) return '-';
        const date = new Date(dateTime);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // 显示错误
    function showError(message) {
        alert(message);
    }
</script>
</body>

</html>
