# 单机模式测试配置（本地开发用）
server:
  port: 8080

spring:
  application:
    name: multi-redisson-example

# Redisson 多集群配置 - 单机模式
redisson:
  multi:
    enabled: true
    primary: primary
    secondary: secondary
    dual-write-enabled: true
    dual-write-thread-pool:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 10000

    instances:
      # 主集群 - 单机模式
      primary:
        mode: single
        single:
          address: redis://127.0.0.1:6379
          # password: your_password
          database: 0
          connection-pool-size: 64
          connection-minimum-idle-size: 24
          connect-timeout: 10000
          timeout: 3000
          retry-attempts: 3
          retry-interval: 1500
        threads: 16
        netty-threads: 32
        codec: org.redisson.client.codec.StringCodec

      # 备份集群 - 单机模式（使用不同 database 模拟）
      secondary:
        mode: single
        single:
          address: redis://127.0.0.1:6379
          # password: your_password
          database: 1
          connection-pool-size: 64
          connection-minimum-idle-size: 24
          connect-timeout: 10000
          timeout: 3000
          retry-attempts: 3
          retry-interval: 1500
        threads: 16
        netty-threads: 32
        codec: org.redisson.client.codec.StringCodec

management:
  endpoints:
    web:
      exposure:
        include: health,info,dualwrite

logging:
  level:
    io.github.archer099.redisson: DEBUG
