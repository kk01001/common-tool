<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis 序列化方式对比测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .test-button {
            display: block;
            margin: 0 auto 30px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .test-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group {
            text-align: center;
            margin: 20px auto;
            color: white;
        }

        .input-group label {
            font-size: 1.1em;
            margin-right: 10px;
        }

        .input-group input {
            padding: 8px 15px;
            font-size: 1em;
            border: 2px solid white;
            border-radius: 5px;
            width: 150px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 20px 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
        }

        .result-card.error {
            background: #fee;
            border: 2px solid #f88;
        }

        .codec-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-weight: 500;
        }

        .metric-value {
            color: #333;
            font-weight: bold;
        }

        .metric-value.highlight {
            color: #667eea;
            font-size: 1.2em;
        }

        .comparison-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .comparison-table h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: bold;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .best {
            color: #28a745;
            font-weight: bold;
        }

        .worst {
            color: #dc3545;
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Redis 序列化方式对比测试</h1>
            <p>比较 STRING、JSON、Protobuf、Kryo、FST 五种序列化方式的性能和内存占用</p>
        </div>

        <button class="test-button" onclick="runTest()" id="testBtn">
            开始测试
        </button>

        <div class="input-group">
            <label for="iterations">测试次数:</label>
            <input type="number" id="iterations" value="1000" min="1" max="100000">
        </div>

        <div class="loading" id="loading" style="display: none;">
            ⏳ 测试进行中，请稍候...
        </div>

        <div class="results-grid" id="resultsGrid"></div>

        <div class="comparison-table" id="comparisonTable" style="display: none;">
            <h2>📊 详细对比表</h2>
            <table>
                <thead>
                    <tr>
                        <th>序列化方式</th>
                        <th>测试次数</th>
                        <th>写入耗时</th>
                        <th>读取耗时</th>
                        <th>删除耗时</th>
                        <th>总耗时</th>
                        <th>单次最大</th>
                        <th>单次最小</th>
                        <th>单次平均</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function runTest() {
            const btn = document.getElementById('testBtn');
            const loading = document.getElementById('loading');
            const resultsGrid = document.getElementById('resultsGrid');
            const comparisonTable = document.getElementById('comparisonTable');
            const iterations = document.getElementById('iterations').value;
            
            btn.disabled = true;
            loading.style.display = 'block';
            resultsGrid.innerHTML = '';
            comparisonTable.style.display = 'none';
            
            try {
                const response = await fetch(`/api/serialization/test?iterations=${iterations}`);
                const results = await response.json();
                
                displayResults(results);
                displayComparisonTable(results);
                
            } catch (error) {
                alert('测试失败: ' + error.message);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResults(results) {
            const resultsGrid = document.getElementById('resultsGrid');
            
            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card' + (result.success ? '' : ' error');
                
                if (result.success) {
                    card.innerHTML = `
                        <div class="codec-name">${result.codecType}</div>
                        <div class="metric">
                            <span class="metric-label">测试次数:</span>
                            <span class="metric-value highlight">${result.iterations}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">写入耗时:</span>
                            <span class="metric-value">${result.writeTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">读取耗时:</span>
                            <span class="metric-value">${result.readTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">删除耗时:</span>
                            <span class="metric-value">${result.deleteTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">总耗时:</span>
                            <span class="metric-value highlight">${result.totalTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">单次最大:</span>
                            <span class="metric-value">${result.maxTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">单次最小:</span>
                            <span class="metric-value">${result.minTimeMs} ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">单次平均:</span>
                            <span class="metric-value">${result.avgTimeMs} ms</span>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="codec-name">${result.codecType}</div>
                        <div class="error-message">❌ 测试失败: ${result.errorMessage}</div>
                    `;
                }
                
                resultsGrid.appendChild(card);
            });
        }

        function displayComparisonTable(results) {
            const tableBody = document.getElementById('tableBody');
            const comparisonTable = document.getElementById('comparisonTable');
            
            tableBody.innerHTML = '';
            
            // Find best values
            const successResults = results.filter(r => r.success);
            if (successResults.length === 0) return;
            
            const minWrite = Math.min(...successResults.map(r => r.writeTimeMs));
            const minRead = Math.min(...successResults.map(r => r.readTimeMs));
            const minDelete = Math.min(...successResults.map(r => r.deleteTimeMs));
            const minTotal = Math.min(...successResults.map(r => r.totalTimeMs));
            const minAvg = Math.min(...successResults.map(r => r.avgTimeMs));
            
            results.forEach(result => {
                const row = document.createElement('tr');
                
                if (result.success) {
                    row.innerHTML = `
                        <td><strong>${result.codecType}</strong></td>
                        <td>${result.iterations}</td>
                        <td class="${result.writeTimeMs === minWrite ? 'best' : ''}">${result.writeTimeMs} ms</td>
                        <td class="${result.readTimeMs === minRead ? 'best' : ''}">${result.readTimeMs} ms</td>
                        <td class="${result.deleteTimeMs === minDelete ? 'best' : ''}">${result.deleteTimeMs} ms</td>
                        <td class="${result.totalTimeMs === minTotal ? 'best' : ''}">${result.totalTimeMs} ms</td>
                        <td>${result.maxTimeMs} ms</td>
                        <td>${result.minTimeMs} ms</td>
                        <td class="${result.avgTimeMs === minAvg ? 'best' : ''}">${result.avgTimeMs} ms</td>
                        <td>✅ 成功</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td><strong>${result.codecType}</strong></td>
                        <td colspan="8" class="error-message">${result.errorMessage}</td>
                        <td>❌ 失败</td>
                    `;
                }
                
                tableBody.appendChild(row);
            });
            
            comparisonTable.style.display = 'block';
        }
    </script>
</body>
</html>
